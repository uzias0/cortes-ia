<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cortes IA - voltando para o app</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#222}a{color:#b58900}</style></head>
<body>
<h1>Voltando para o Cortes IA…</h1>
<p id="msg">Passando a autorização do TikTok para o app no seu computador.</p>
<p>Se nada acontecer, o Cortes IA precisa estar aberto neste computador (<code>http://127.0.0.1:8000</code>). <a id="link" href="http://127.0.0.1:8000/">Abrir o app</a></p>
<script>
  // O TikTok só aceita endereço HTTPS público; esta página repassa o código para o app local (o navegador do próprio usuário faz a ponte).
  var alvo = "http://127.0.0.1:8000/api/tiktok/callback" + location.search;
  document.getElementById("link").href = alvo;
  if (location.search.indexOf("code=") !== -1 || location.search.indexOf("error=") !== -1) location.replace(alvo);
  else document.getElementById("msg").textContent = "Esta página só é usada quando você conecta o TikTok pelo Cortes IA.";
</script>
</body></html>
